# SmallCNN — theo khuôn config/detector/resnet34.yaml của DeepfakeBench
model_name: small_cnn
backbone_name: small_cnn
backbone_config:
  width: [16, 32, 64, 128]        # 4 tầng, 96→48→24→12→6, 97 nghìn tham số
pretrained: null

train_dataset: [wdf]
dataset_type: plain               # plain | blend (SBI)
train_batchSize: 64
test_batchSize: 256
frame_num: {train: 24, test: 24}  # khung / video
resolution: 96

use_data_augmentation: true       # cùng danh sách phép biến đổi với DeepfakeBench
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [0.5, 1.5]          # bán kính Gaussian (PIL) — họ dùng cỡ kernel 3–7 ở 256 px
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

optimizer:
  type: adam
  adam: {lr: 0.001, beta1: 0.9, beta2: 0.999, eps: 0.00000001, weight_decay: 0.0001, amsgrad: false}
  sgd: {lr: 0.001, momentum: 0.9, weight_decay: 0.0001}
lr_scheduler: null
nEpochs: 25
patience: 5                       # dừng sớm (ta thêm)
manualSeed: 0
loss_func: cross_entropy
metric_scoring: video_auc         # chọn checkpoint theo AUC video trên validation
cuda: auto
